    <!-- Pre-existing gap found and fixed while verifying epic C2.3 in the browser: since C2.2,
         garden-state-validate.js/garden-state-lifecycle.js read root.GardenCampaignClock
         unconditionally (Clock.DEFAULT_ACTIVE_SECONDS/Clock.DAY_SECONDS) but this script was
         never added here, so every browser page load threw before this fix (confirmed by
         reproducing the same TypeError on commit 2a410b6, unmodified, via `git stash`) — Node
         tests never caught it because tests require() campaign-clock.js directly. Must load
         before garden-state-validate.js/-lifecycle.js below. -->
    <script src="/game/campaign-clock.js" defer></script>
    <!-- Epic C2.4: garden-state-validate.js now also reads root.GardenRainelles (VERBS, to
         validate a taught geste) at script-execution time, so rainelles.js (pure schema, no
         dependency of its own) must load before it here too — the same class of ordering bug
         found and fixed for campaign-clock.js above while verifying C2.3 in the browser, caught
         this time before commit rather than after. Still also loaded before garden-state-cmd-f.js/
         -i.js/-j.js further below, which read it again at their own execution time. -->
    <script src="/game/rainelles.js" defer></script>
    <!-- Epic C2.6a: campaign-stations.js's registry is read by garden-state-validate.js just
         below, same reason rainelles.js/campaign-clock.js load before it. -->

    <!-- Campaign layer (docs/campagne-backlog.md phase 1). botany-genetics/botany-pot/cultivars
         must load before garden-state-cmd-f.js, which reads root.GardenGenetics/GardenPot/
         GardenCultivars at script-execution time. C1.1-C1.3 had proven this purely in Node; wiring
         it into the live page is completed here, as a prerequisite for C1.4's notebook commands. -->
    <script src="/game/botany-genetics.js" defer></script>
    <!-- Epic C1.7: modular rendering of hybrid cultivars, kept apart from botany-genetics.js
         (data) the same way botany.js/garden-models*.js render the free garden's own species —
         no dependency on GardenGenetics at load time, only THREE, so its only ordering
         requirement is loading after /vendor/three.min.js (line 28). -->
    <script src="/game/botany-hybrids.js" defer></script>
    <script src="/game/botany-pot.js" defer></script>
    <script src="/game/cultivars.js" defer></script>
    <!-- rainelles.js itself now loads much earlier (before garden-state-validate.js, see the
         C2.4 comment above) since validate.js needs it too; it remains before garden-state-cmd-
         f.js/-i.js/-j.js below, which also read root.GardenRainelles at their own execution
         time, same ordering requirement as botany-genetics.js/-pot.js/cultivars.js above. -->
    <script src="/garden-state-cmd-f.js" defer></script>

  <body>
    <header class="site-header">
      <a class="identity" href="/portfolio/"
        >Edwin Dayot<span>Product engineer</span></a
      ><a class="portfolio-link" href="/portfolio/"
        >Voir le portfolio <span aria-hidden="true">↗</span></a
      >
    </header>
    <main
      class="garden-shell"
      id="jardin"
      tabindex="0"
      aria-label="Jardin. Flèches ou ZQSD pour marcher immédiatement, E pour agir, 1 à 5 pour équiper, I pour l’inventaire."
    >
      <div class="garden-stage">
        <canvas
          id="garden-world"
          aria-label="Pépinière 3D. Clique sur le terrain pour marcher, sur un objet pour l’approcher."
        ></canvas>
      </div>
      <div id="garden-fallback">
        <h1>Edwin Dayot</h1>
        <p>Product engineer : IA, mobile et web.</p>
        <p>Le jardin interactif nécessite JavaScript et WebGL.</p>
        <a class="primary" href="/portfolio/">Découvrir les projets</a>
      </div>
      <canvas
        id="garden-hud"
        hidden
        tabindex="0"
        role="application"
        aria-label="Jardin. ZQSD ou flèches pour marcher. 1 à 5 pour équiper, I inventaire, E maintenir pour travailler. Dans l’inventaire : flèches et Entrée, 1 à 5 pour affecter, Échap pour fermer."
      ></canvas>
      <p
        id="game-announcement"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></p>
      <input
        id="import-file"
        type="file"
        accept="application/json,.json"
        hidden
      />
      <input
        id="cultivar-rename-input"
        type="text"
        maxlength="40"
        autocomplete="off"
        aria-label="Nouveau nom du cultivar"
        hidden
      />
    </main>
