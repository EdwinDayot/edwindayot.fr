server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location = /index.html { expires -1; }
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
